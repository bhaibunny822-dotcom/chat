<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LinkChat — Chat Without Accounts</title>
  
  <meta name="description" content="Instant ephemeral private chat. No accounts, no phone numbers, no history." />
  <meta name="theme-color" content="#090d16" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Global MQTT WebSocket Engine (Works inside Instagram & on Mobile 4G/5G) -->
  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #090d16;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #root { height: 100%; display: flex; flex-direction: column; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-msg { animation: slideUp 0.18s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    const MAX_CHARS = 10000;
    
    // Enterprise public SSL WebSocket brokers for instant cross-country messaging
    const MQTT_BROKER = "wss://broker.hivemq.com:8884/mqtt";

    function getSessionToken() {
      let id = sessionStorage.getItem("linkchat_token");
      if (!id) {
        id = "u_" + Math.random().toString(36).substring(2, 9);
        sessionStorage.setItem("linkchat_token", id);
      }
      return id;
    }

    function generateRoomCode() {
      const chars = "abcdefghjkmnpqrstuvwxyz23456789";
      let res = "";
      for (let i = 0; i < 6; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
      return res;
    }

    function QRCodeRenderer({ text, size = 160 }) {
      const src = `https://api.qrserver.com/v1/create-qr-code/?size=${size * 2}x${size * 2}&data=${encodeURIComponent(text)}&color=090d16&bgcolor=ffffff&qzone=1`;
      return (
        <div className="p-3 bg-white rounded-2xl shadow-xl inline-block border border-slate-700">
          <img src={src} alt="Room QR" width={size} height={size} className="rounded-lg block object-contain" />
        </div>
      );
    }

    function App() {
      const [screen, setScreen] = useState('landing');
      const [userToken] = useState(getSessionToken);
      const [nickname, setNickname] = useState(() => localStorage.getItem("lc_nick") || "");
      const [roomId, setRoomId] = useState("");
      const [isConnected, setIsConnected] = useState(false);
      const [participants, setParticipants] = useState({});
      
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState("");
      const [activeTypers, setActiveTypers] = useState({});
      const [showShareModal, setShowShareModal] = useState(false);
      const [copied, setCopied] = useState(false);

      const clientRef = useRef(null);
      const messagesEndRef = useRef(null);
      const typingTimeoutRef = useRef(null);

      // Detect room from query or hash parameter
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        let r = params.get('room');
        if (!r && window.location.hash.includes('room=')) {
          r = new URLSearchParams(window.location.hash.split('?')[1] || window.location.hash.replace('#', '')).get('room');
        }
        if (r) {
          setRoomId(r);
          setScreen('join');
        }
      }, []);

      const appendMessage = (msg) => {
        setMessages(prev => {
          if (prev.some(m => m.id === msg.id)) return prev;
          let list = [...prev, msg];
          let total = list.reduce((a, m) => a + (m.text ? m.text.length : 0), 0);
          while (total > MAX_CHARS && list.length > 1) {
            const out = list.shift();
            if (out && out.text) total -= out.text.length;
          }
          return list;
        });
      };

      const startChatConnection = (targetRoom, nick) => {
        const cleanRoom = targetRoom.toLowerCase().trim();
        const topic = `linkchat/rooms/${cleanRoom}/mesh`;

        // Connect over standard HTTPS/WSS (Bypasses all mobile carrier & Instagram firewalls)
        const client = mqtt.connect(MQTT_BROKER, {
          clientId: `lc_${userToken}_${Math.random().toString(16).substring(2, 8)}`,
          clean: true,
          reconnectPeriod: 2000,
          connectTimeout: 10000
        });

        clientRef.current = client;

        client.on('connect', () => {
          setIsConnected(true);
          client.subscribe(topic, { qos: 1 });

          // Broadcast join event
          const joinPacket = {
            type: 'USER_JOINED',
            token: userToken,
            nickname: nick
          };
          client.publish(topic, JSON.stringify(joinPacket));

          // Ping existing users for room chat history
          client.publish(topic, JSON.stringify({ type: 'REQ_SYNC', token: userToken }));
        });

        client.on('message', (t, payload) => {
          try {
            const packet = JSON.parse(payload.toString());
            if (!packet || typeof packet !== 'object') return;

            switch (packet.type) {
              case 'CHAT_MSG':
                appendMessage(packet.message);
                break;

              case 'USER_JOINED':
                setParticipants(prev => ({ ...prev, [packet.token]: packet.nickname }));
                if (packet.token !== userToken) {
                  appendMessage({
                    id: 'sys_' + Date.now() + Math.random(),
                    type: 'system',
                    text: `${packet.nickname} joined the chat.`
                  });
                }
                break;

              case 'USER_TYPING':
                if (packet.token !== userToken) {
                  setActiveTypers(prev => ({ ...prev, [packet.nickname]: Date.now() + 2500 }));
                }
                break;

              case 'REQ_SYNC':
                // Someone joined; send our current messages if we have any
                if (packet.token !== userToken && messages.length > 0) {
                  client.publish(topic, JSON.stringify({
                    type: 'RES_SYNC',
                    messages: messages
                  }));
                }
                break;

              case 'RES_SYNC':
                if (packet.messages && packet.messages.length > 0) {
                  setMessages(prev => {
                    const map = new Map();
                    [...prev, ...packet.messages].forEach(m => map.set(m.id, m));
                    return Array.from(map.values()).sort((a,b) => a.timestamp - b.timestamp);
                  });
                }
                break;

              case 'REACTION':
                setMessages(prev => prev.map(m => {
                  if (m.id !== packet.messageId) return m;
                  const rx = { ...(m.reactions || {}) };
                  rx[packet.emoji] = (rx[packet.emoji] || 0) + 1;
                  return { ...m, reactions: rx };
                }));
                break;
            }
          } catch (e) {}
        });

        client.on('offline', () => setIsConnected(false));
        client.on('error', () => setIsConnected(false));
      };

      const handleCreateRoom = () => {
        if (!nickname.trim()) {
          alert("Please enter a temporary nickname.");
          return;
        }
        const nick = nickname.trim();
        localStorage.setItem("lc_nick", nick);
        const code = generateRoomCode();
        setRoomId(code);
        window.history.pushState({}, '', `?room=${code}`);
        setScreen('chat');
        setShowShareModal(true);
        startChatConnection(code, nick);
        appendMessage({
          id: 'init_msg',
          type: 'system',
          text: '🔒 Private room created. Send the link or QR to connect.'
        });
        try { confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 } }); } catch (e) {}
      };

      const handleJoinRoom = () => {
        if (!nickname.trim()) {
          alert("Please enter a nickname.");
          return;
        }
        const nick = nickname.trim();
        localStorage.setItem("lc_nick", nick);
        setScreen('chat');
        startChatConnection(roomId, nick);
      };

      // Typing decay cleanup
      useEffect(() => {
        const iv = setInterval(() => {
          const now = Date.now();
          setActiveTypers(prev => {
            let changed = false;
            const updated = {};
            for (const [name, expire] of Object.entries(prev)) {
              if (expire > now) updated[name] = expire;
              else changed = true;
            }
            return changed ? updated : prev;
          });
        }, 1000);
        return () => clearInterval(iv);
      }, []);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, activeTypers]);

      const handleSendMessage = (e) => {
        e.preventDefault();
        const trimmed = inputText.trim();
        if (!trimmed || !clientRef.current) return;

        const newMsg = {
          id: 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          type: 'user',
          senderToken: userToken,
          senderNickname: nickname,
          text: trimmed,
          timestamp: Date.now(),
          reactions: {}
        };

        const topic = `linkchat/rooms/${roomId.toLowerCase().trim()}/mesh`;
        clientRef.current.publish(topic, JSON.stringify({
          type: 'CHAT_MSG',
          message: newMsg
        }));

        setInputText("");
      };

      const handleTypingInput = (e) => {
        setInputText(e.target.value);
        if (clientRef.current) {
          const topic = `linkchat/rooms/${roomId.toLowerCase().trim()}/mesh`;
          clientRef.current.publish(topic, JSON.stringify({
            type: 'USER_TYPING',
            token: userToken,
            nickname: nickname
          }));
        }
      };

      const addReaction = (messageId, emoji) => {
        if (!clientRef.current) return;
        const topic = `linkchat/rooms/${roomId.toLowerCase().trim()}/mesh`;
        clientRef.current.publish(topic, JSON.stringify({
          type: 'REACTION',
          messageId,
          emoji
        }));
      };

      const totalCharsUsed = useMemo(() => {
        return messages.reduce((a, m) => a + (m.text ? m.text.length : 0), 0);
      }, [messages]);

      const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}`;

      const handleShareLink = async () => {
        if (navigator.share) {
          try {
            await navigator.share({
              title: "Join my LinkChat",
              text: "Private ephemeral chat room. Zero registration.",
              url: inviteUrl
            });
          } catch (e) {}
        } else {
          navigator.clipboard.writeText(inviteUrl);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };

      // --- SCREEN 1: LANDING ---
      if (screen === 'landing') {
        return (
          <div className="flex-1 flex flex-col justify-between max-w-md mx-auto w-full p-6 overflow-y-auto">
            <div className="pt-8">
              <div className="w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 text-2xl mb-6 shadow-lg shadow-indigo-500/10">
                <i className="fa-solid fa-bolt"></i>
              </div>
              <h1 className="text-3xl font-extrabold text-white tracking-tight mb-3">
                Chat without <br />
                <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">
                  accounts.
                </span>
              </h1>
              <p className="text-slate-400 text-sm leading-relaxed">
                Instant private room. Works across phones, laptops, Instagram DMs, and cellular data anywhere in the world.
              </p>
            </div>

            <div className="my-8 bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-2xl backdrop-blur-xl">
              <label className="block text-xs uppercase font-bold tracking-wider text-slate-400 mb-2">
                Your Nickname
              </label>
              <input
                type="text"
                maxLength={20}
                placeholder="e.g. Alex, Maverick"
                value={nickname}
                onChange={(e) => setNickname(e.target.value)}
                className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-all font-medium mb-5"
              />

              <button
                type="button"
                onClick={handleCreateRoom}
                className="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-semibold py-4 rounded-2xl shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 transition-all"
              >
                <span>Create Private Chat</span>
                <i className="fa-solid fa-arrow-right text-xs"></i>
              </button>
            </div>

            <div className="grid grid-cols-2 gap-3 text-xs text-slate-400 pb-4">
              <div className="flex items-center gap-2 p-3 rounded-2xl bg-slate-900/60 border border-slate-800/80">
                <i className="fa-brands fa-instagram text-pink-400 text-sm"></i>
                <span>Reel Previews</span>
              </div>
              <div className="flex items-center gap-2 p-3 rounded-2xl bg-slate-900/60 border border-slate-800/80">
                <i className="fa-solid fa-shield-halved text-indigo-400 text-sm"></i>
                <span>100% Ephemeral</span>
              </div>
            </div>
          </div>
        );
      }

      // --- SCREEN 2: JOIN ---
      if (screen === 'join') {
        return (
          <div className="flex-1 flex flex-col justify-center max-w-sm mx-auto w-full p-6">
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-7 shadow-2xl backdrop-blur-xl text-center">
              <div className="w-14 h-14 mx-auto rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center text-xl mb-4">
                <i className="fa-solid fa-door-open"></i>
              </div>
              <h2 className="text-xl font-bold text-white mb-1">Join Chat Room</h2>
              <p className="text-xs text-slate-400 mb-6">
                Room <span className="font-mono text-indigo-400 font-bold">{roomId}</span>
              </p>

              <input
                type="text"
                autoFocus
                maxLength={20}
                placeholder="Enter your nickname..."
                value={nickname}
                onChange={(e) => setNickname(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && handleJoinRoom()}
                className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 mb-4 text-center font-medium"
              />

              <button
                type="button"
                onClick={handleJoinRoom}
                className="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-semibold py-3.5 rounded-2xl shadow-lg shadow-indigo-600/30 transition-all"
              >
                Enter Chat
              </button>
            </div>
          </div>
        );
      }

      // --- SCREEN 3: ACTIVE CHAT ROOM ---
      return (
        <div className="flex-1 flex flex-col h-full relative max-w-md mx-auto w-full border-x border-slate-900 shadow-2xl">
          
          {/* Header */}
          <header className="px-4 py-3 bg-slate-900/90 border-b border-slate-800/80 flex items-center justify-between sticky top-0 z-30 backdrop-blur-md">
            <div className="flex items-center gap-3">
              <div className={`w-2.5 h-2.5 rounded-full ${isConnected ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></div>
              <div>
                <div className="flex items-center gap-1.5">
                  <span className="font-bold text-sm text-white">Room {roomId}</span>
                </div>
                <div className="text-[11px] text-slate-400">
                  {isConnected ? 'Online' : 'Connecting...'} • {totalCharsUsed}/10k chars
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => setShowShareModal(true)}
                className="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white text-xs flex items-center gap-1.5 active:scale-95 transition-all"
              >
                <i className="fa-solid fa-share-nodes"></i>
                <span>Invite</span>
              </button>
            </div>
          </header>

          {/* Messages */}
          <main className="flex-1 overflow-y-auto px-4 py-4 space-y-3.5 scrollbar-none">
            {messages.map((msg) => {
              if (msg.type === 'system') {
                return (
                  <div key={msg.id} className="flex justify-center my-2">
                    <span className="text-[11px] text-slate-400 bg-slate-900 px-3 py-1 rounded-full border border-slate-800">
                      {msg.text}
                    </span>
                  </div>
                );
              }

              const isMe = msg.senderToken === userToken;
              const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

              return (
                <div key={msg.id} className={`flex flex-col animate-msg ${isMe ? 'items-end' : 'items-start'}`}>
                  <div className="flex items-center gap-1.5 mb-1 px-1 text-[11px]">
                    <span className={isMe ? 'text-indigo-400 font-medium' : 'text-slate-400'}>{msg.senderNickname}</span>
                    <span className="text-[10px] text-slate-600">{time}</span>
                  </div>

                  <div className={`relative max-w-[85%] rounded-2xl px-4 py-2.5 text-sm ${
                    isMe ? 'bg-indigo-600 text-white rounded-tr-xs' : 'bg-slate-900 text-slate-100 border border-slate-800 rounded-tl-xs'
                  }`}>
                    <div className="break-words select-text">{msg.text}</div>

                    {msg.reactions && Object.keys(msg.reactions).length > 0 && (
                      <div className="flex flex-wrap gap-1 mt-1.5 pt-1 border-t border-white/10">
                        {Object.entries(msg.reactions).map(([emoji, count]) => (
                          <span key={emoji} className="text-xs bg-black/20 px-1.5 py-0.5 rounded-full">
                            {emoji} {count > 1 ? count : ''}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="flex gap-1.5 mt-1 px-1 text-xs opacity-60 hover:opacity-100 transition-opacity">
                    <button onClick={() => addReaction(msg.id, '❤️')} className="hover:scale-125 transition-transform">❤️</button>
                    <button onClick={() => addReaction(msg.id, '🔥')} className="hover:scale-125 transition-transform">🔥</button>
                    <button onClick={() => addReaction(msg.id, '😂')} className="hover:scale-125 transition-transform">😂</button>
                  </div>
                </div>
              );
            })}

            {Object.keys(activeTypers).length > 0 && (
              <div className="text-xs text-indigo-400 italic py-1 animate-pulse">
                {Object.keys(activeTypers).join(', ')} is typing...
              </div>
            )}
            <div ref={messagesEndRef} />
          </main>

          {/* Composer */}
          <footer className="p-3 bg-slate-900/90 border-t border-slate-800/80 sticky bottom-0 z-20 backdrop-blur-md">
            <form onSubmit={handleSendMessage} className="flex items-center gap-2">
              <input
                type="text"
                placeholder="Type a message..."
                value={inputText}
                onChange={handleTypingInput}
                className="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-all"
              />
              <button
                type="submit"
                disabled={!inputText.trim()}
                className="w-11 h-11 bg-indigo-600 hover:bg-indigo-500 active:scale-95 disabled:bg-slate-800 disabled:text-slate-600 text-white rounded-2xl flex items-center justify-center shrink-0 shadow-md transition-all"
              >
                <i className="fa-solid fa-arrow-up text-sm"></i>
              </button>
            </form>
          </footer>

          {/* Share Modal */}
          {showShareModal && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 text-center relative shadow-2xl">
                <button
                  onClick={() => setShowShareModal(false)}
                  className="absolute top-4 right-4 p-1.5 text-slate-400 hover:text-white rounded-full bg-slate-800 text-xs w-6 h-6 flex items-center justify-center"
                >
                  ✕
                </button>

                <h3 className="text-lg font-bold text-white mb-1">Invite Partner</h3>
                <p className="text-xs text-slate-400 mb-5">Scan this QR code with any smartphone:</p>

                <div className="flex justify-center mb-5">
                  <QRCodeRenderer text={inviteUrl} size={150} />
                </div>

                <div className="flex items-center gap-2 bg-slate-950 p-2 rounded-2xl border border-slate-800 mb-4">
                  <input
                    type="text"
                    readOnly
                    value={inviteUrl}
                    className="bg-transparent text-xs text-slate-300 w-full px-2 outline-none font-mono truncate"
                  />
                  <button
                    onClick={handleShareLink}
                    className="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white transition-colors shrink-0"
                  >
                    {copied ? "Copied!" : "Copy"}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
