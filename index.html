<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuickChat</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--me:#2563eb;--text:#111827;--muted:#6b7280;--line:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1b1e25;--text:#f3f4f6;--muted:#9ca3af;--line:#2a2e37}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header b{font-size:18px}
#status{font-size:12px;color:var(--muted)}
#status:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#ef4444}
#status.on:before{background:#22c55e}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btns button{background:none;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:4px 12px;font-size:13px}
#people{padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#people .cnt{font-weight:600;margin-right:4px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.chip.you{border-color:var(--me);color:var(--me)}
#list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--me);color:#fff;border-color:var(--me)}
.m.bad{opacity:.55}
.m small{display:block;font-size:11px;opacity:.7;margin-bottom:2px}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;padding:20px}
#bar{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
#txt{flex:1;font-size:16px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none}
#send{border:0;background:var(--me);color:#fff;border-radius:999px;padding:0 20px;font-size:16px;font-weight:600}
#send:disabled{opacity:.4}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><b>QuickChat</b><div id="status">connecting...</div></div>
    <div class="btns"><button id="nameBtn"></button><button id="roomBtn"></button><button id="shareBtn">Share</button></div>
  </header>
  <div id="people"><span class="cnt">1 online</span></div>
  <div id="list"></div>
  <div id="bar"><input id="txt" placeholder="Type a message" maxlength="500" autocomplete="off"><button id="send" disabled>Send</button></div>
</div>
<script>
(function(){
  // ===== Settings =====
  // CHANGE APP_ID to any unique text of your own so your chat doesn't mix with other copies of this file.
  var APP_ID = 'quickchat-x7k2m9';
  // Free public MQTT brokers (WebSocket over TLS). The app talks to all of them at once and removes duplicates.
  var BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081'];
  var KEEP = 10;

  // ===== Identity, room =====
  function rnd(n){ var s = '', c = 'abcdefghijklmnopqrstuvwxyz0123456789'; for (var i = 0; i < n; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }
  function cleanRoom(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40); }
  var room = cleanRoom(new URLSearchParams(location.search).get('room')) || 'public';
  var topic = APP_ID + '/' + room;
  var me = rnd(10);
  var name = 'Guest' + Math.floor(1000 + Math.random() * 9000);

  // ===== Tiny MQTT 3.1.1 client (no libraries) =====
  var enc = new TextEncoder(), dec = new TextDecoder();
  function str(s){ var b = enc.encode(s), o = new Uint8Array(2 + b.length); o[0] = b.length >> 8; o[1] = b.length & 255; o.set(b, 2); return o; }
  function cat(){ var n = 0, a = arguments, i; for (i = 0; i < a.length; i++) n += a[i].length; var o = new Uint8Array(n), p = 0; for (i = 0; i < a.length; i++) { o.set(a[i], p); p += a[i].length; } return o; }
  function pkt(first, body){ var l = [], n = body.length, d; do { d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; l.push(d); } while (n > 0); return cat(new Uint8Array([first].concat(l)), body); }
  var PING = new Uint8Array([0xC0, 0]);
  var byePayload = JSON.stringify({ k: 'b', id: me, u: 'bye' + me });
  var CONNECT = pkt(0x10, cat(str('MQTT'), new Uint8Array([4, 0x06, 0, 60]), str('qc' + me), str(topic), str(byePayload)));
  var SUB = pkt(0x82, cat(new Uint8Array([0, 1]), str(topic), new Uint8Array([0])));
  var links = [];

  function anyOnline(){ return links.some(function(l){ return l.ok; }); }

  function parse(L, data){
    L.buf = cat(L.buf, data);
    while (L.buf.length >= 2) {
      var mul = 1, len = 0, i = 1, b;
      do { if (i >= L.buf.length) return; b = L.buf[i++]; len += (b & 127) * mul; mul *= 128; } while (b & 128);
      if (L.buf.length < i + len) return;
      var type = L.buf[0] >> 4, flags = L.buf[0] & 15, body = L.buf.subarray(i, i + len);
      L.buf = L.buf.subarray(i + len);
      if (type === 2) {
        if (body[1] === 0) {
          L.ok = true; L.retry = 1000;
          L.ws.send(SUB);
          clearInterval(L.ping);
          L.ping = setInterval(function(){ try { L.ws.send(PING); } catch (e) {} }, 20000);
          setStatus(); announce(true);
        } else { try { L.ws.close(); } catch (e) {} }
      } else if (type === 3) {
        var tl = (body[0] << 8) | body[1], off = 2 + tl;
        if ((flags >> 1) & 3) off += 2;
        onPacket(dec.decode(body.subarray(off)));
      }
    }
  }

  function openLink(url){
    var L = { ok: false, buf: new Uint8Array(0), retry: 1000, ws: null, ping: null };
    links.push(L);
    function go(){
      var ws;
      try { ws = new WebSocket(url, 'mqtt'); } catch (e) { return later(); }
      L.ws = ws; L.buf = new Uint8Array(0); ws.binaryType = 'arraybuffer';
      ws.onopen = function(){ ws.send(CONNECT); };
      ws.onmessage = function(e){ parse(L, new Uint8Array(e.data)); };
      ws.onclose = function(){ L.ok = false; clearInterval(L.ping); setStatus(); later(); };
      ws.onerror = function(){ try { ws.close(); } catch (e) {} };
    }
    function later(){ if (L.timer) return; L.timer = setTimeout(function(){ L.timer = 0; go(); }, L.retry); L.retry = Math.min(L.retry * 2, 15000); }
    L.go = go; go();
  }

  function publish(obj){
    var p = pkt(0x30, cat(str(topic), enc.encode(JSON.stringify(obj)))), sent = 0;
    links.forEach(function(L){ if (L.ok) { try { L.ws.send(p); sent++; } catch (e) {} } });
    return sent;
  }

  // ===== Chat state =====
  var msgs = [], peers = {}, seen = {}, seenOrder = [];
  var list = document.getElementById('list'), txt = document.getElementById('txt'), send = document.getElementById('send');
  var statusEl = document.getElementById('status'), nameBtn = document.getElementById('nameBtn');
  var roomBtn = document.getElementById('roomBtn'), shareBtn = document.getElementById('shareBtn');
  nameBtn.textContent = name; roomBtn.textContent = '# ' + room;

  function once(u){
    if (!u || seen[u]) return false;
    seen[u] = 1; seenOrder.push(u);
    if (seenOrder.length > 300) delete seen[seenOrder.shift()];
    return true;
  }
  function cl(s, n){ return String(s == null ? '' : s).replace(/[\u0000-\u001f\u007f\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g, '').trim().slice(0, n); }

  function render(){
    list.textContent = '';
    if (!msgs.length) {
      var e = document.createElement('div'); e.className = 'empty';
      e.textContent = 'No messages yet. Only the latest ' + KEEP + ' are kept, and nothing is saved.';
      list.appendChild(e);
    }
    msgs.forEach(function(m){
      var d = document.createElement('div'); d.className = 'm' + (m.mine ? ' me' : '') + (m.bad ? ' bad' : '');
      var s = document.createElement('small'); s.textContent = (m.mine ? 'You' : m.name) + (m.bad ? ' (not sent)' : '');
      var t = document.createElement('span'); t.textContent = m.text;
      d.appendChild(s); d.appendChild(t); list.appendChild(d);
    });
    list.scrollTop = list.scrollHeight;
  }
  function addMsg(m){ msgs.push(m); while (msgs.length > KEEP) msgs.shift(); render(); }

  function renderPeers(){
    var box = document.getElementById('people'); box.textContent = '';
    var ids = Object.keys(peers);
    var c = document.createElement('span'); c.className = 'cnt'; c.textContent = (ids.length + 1) + ' online'; box.appendChild(c);
    var y = document.createElement('span'); y.className = 'chip you'; y.textContent = name + ' (you)'; box.appendChild(y);
    ids.forEach(function(id){ var ch = document.createElement('span'); ch.className = 'chip'; ch.textContent = peers[id].name; box.appendChild(ch); });
  }

  function setStatus(){
    var on = anyOnline();
    statusEl.className = on ? 'on' : ''; statusEl.textContent = on ? 'live' : 'connecting...';
    send.disabled = !on;
  }

  function announce(join){ publish({ k: 'p', id: me, n: name, j: join ? 1 : 0, u: rnd(8) }); }

  function onPacket(raw){
    var d; try { d = JSON.parse(raw); } catch (e) { return; }
    if (!d || typeof d !== 'object' || d.id === me || !once(d.u)) return;
    var id = cl(d.id, 20); if (!id) return;
    if (d.k === 'm') {
      var t = cl(d.t, 500); if (!t) return;
      addMsg({ name: cl(d.n, 20) || 'Guest', text: t });
      if (peers[id]) peers[id].seen = Date.now();
    } else if (d.k === 'p') {
      peers[id] = { name: cl(d.n, 20) || 'Guest', seen: Date.now() };
      renderPeers();
      if (d.j) setTimeout(function(){ announce(false); }, Math.random() * 800); // let newcomers see us quickly
    } else if (d.k === 'b') {
      if (peers[id]) { delete peers[id]; renderPeers(); }
    }
  }

  // ===== UI =====
  var lastSend = 0;
  function doSend(){
    var v = txt.value.trim(); if (!v) return;
    var now = Date.now(); if (now - lastSend < 600) return; lastSend = now;
    var ok = publish({ k: 'm', id: me, n: name, t: v.slice(0, 500), u: rnd(10) }) > 0;
    addMsg({ mine: true, text: v.slice(0, 500), bad: !ok });
    txt.value = ''; txt.focus();
  }
  send.onclick = doSend;
  txt.addEventListener('keydown', function(e){ if (e.key === 'Enter') doSend(); });

  nameBtn.onclick = function(){
    var n = prompt('Your display name', name);
    if (n && cl(n, 20)) { name = cl(n, 20); nameBtn.textContent = name; renderPeers(); announce(false); }
  };
  roomBtn.onclick = function(){
    var r = prompt('Room name. Friends who open the same room link chat with you. Use a hard-to-guess name for privacy.', room);
    r = cleanRoom(r);
    if (r && r !== room) location.search = '?room=' + r;
  };
  shareBtn.onclick = function(){
    var url = location.origin + location.pathname + '?room=' + room;
    if (navigator.share) { navigator.share({ title: 'QuickChat', url: url }).catch(function(){}); }
    else if (navigator.clipboard) { navigator.clipboard.writeText(url).then(function(){ alert('Link copied'); }, function(){ prompt('Copy this link', url); }); }
    else prompt('Copy this link', url);
  };

  // Tidy up: drop people we haven't heard from, send a goodbye on exit, keep presence fresh.
  setInterval(function(){
    var now = Date.now(), ch = false;
    Object.keys(peers).forEach(function(id){ if (now - peers[id].seen > 80000) { delete peers[id]; ch = true; } });
    if (ch) renderPeers();
    if (anyOnline()) announce(false);
  }, 25000);
  window.addEventListener('pagehide', function(){ publish({ k: 'b', id: me, u: rnd(8) }); });
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible') return;
    links.forEach(function(L){
      if (!L.ok && (!L.ws || L.ws.readyState > 1)) { if (L.timer) { clearTimeout(L.timer); L.timer = 0; } L.go(); }
    });
    announce(true);
  });

  render(); renderPeers(); setStatus();
  BROKERS.forEach(openLink);
})();
</script>
</body>
</html>
