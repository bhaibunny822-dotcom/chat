<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LinkChat — Chat Without Accounts</title>
  
  <meta name="description" content="Instant ephemeral private chat. No accounts, no phone numbers, no history. Create a link and chat." />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            darkBg: '#090d16',
            darkCard: '#111827',
            darkBorder: '#1f2937',
            darkInput: '#161f30'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Confetti Animation -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #090d16;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-message {
      animation: slideUpFade 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .instagram-gradient {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    .glassmorphism {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const MAX_BUFFER_CHARS = 10000;
    const STORAGE_PREFIX = "linkchat_room_";
    const SESSION_ID_KEY = "linkchat_session_id";
    const THEME_KEY = "linkchat_theme";

    // STUN config for WebRTC peer signaling
    const RTC_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    function getSessionToken() {
      let id = sessionStorage.getItem(SESSION_ID_KEY);
      if (!id) {
        id = "usr_" + Math.random().toString(36).substring(2, 9) + Date.now().toString(36);
        sessionStorage.setItem(SESSION_ID_KEY, id);
      }
      return id;
    }

    function generateRoomId() {
      const chars = "abcdefghjkmnpqrstuvwxyz23456789";
      let res = "";
      for (let i = 0; i < 8; i++) {
        res += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return `${res.slice(0, 4)}-${res.slice(4)}`;
    }

    function getAvatarBg(name) {
      const colors = [
        "bg-rose-500", "bg-pink-500", "bg-purple-600", "bg-indigo-600",
        "bg-blue-600", "bg-cyan-600", "bg-teal-600", "bg-emerald-600",
        "bg-amber-600", "bg-orange-600"
      ];
      let hash = 0;
      for (let i = 0; i < (name || "").length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      return colors[Math.abs(hash) % colors.length];
    }

    const URL_REGEX = /(https?:\/\/[^\s]+)/gi;

    function extractUrls(text) {
      if (!text) return [];
      const matches = text.match(URL_REGEX);
      return matches ? Array.from(new Set(matches)) : [];
    }

    function parseLinkMetadata(url) {
      try {
        const u = new URL(url);
        const host = u.hostname.replace("www.", "");
        
        // Instagram Reel Check
        if (host.includes("instagram.com") && (u.pathname.includes("/reel/") || u.pathname.includes("/p/"))) {
          return {
            type: "instagram",
            url,
            domain: "Instagram Reel",
            title: "Instagram Reel Video",
            badge: "Instagram"
          };
        }

        // YouTube or Shorts Check
        if (host.includes("youtube.com") || host.includes("youtu.be")) {
          const isShort = u.pathname.includes("/shorts/");
          let videoId = "";
          if (host.includes("youtu.be")) {
            videoId = u.pathname.slice(1);
          } else if (isShort) {
            videoId = u.pathname.split("/shorts/")[1];
          } else {
            videoId = u.searchParams.get("v");
          }
          return {
            type: "youtube",
            url,
            isShort,
            videoId,
            domain: isShort ? "YouTube Shorts" : "YouTube Video",
            title: isShort ? "Watch YouTube Short" : "Watch YouTube Video",
            badge: "YouTube"
          };
        }

        return {
          type: "generic",
          url,
          domain: host,
          title: host,
          badge: "Web Link"
        };
      } catch (e) {
        return null;
      }
    }

    function QRCodeRenderer({ text, size = 180 }) {
      const [qrSrc, setQrSrc] = useState("");

      useEffect(() => {
        const encoded = encodeURIComponent(text);
        setQrSrc(`https://api.qrserver.com/v1/create-qr-code/?size=${size * 2}x${size * 2}&data=${encoded}&color=090d16&bgcolor=ffffff&qzone=1`);
      }, [text, size]);

      return (
        <div className="p-3 bg-white rounded-2xl shadow-xl inline-block border border-slate-700/50">
          <img 
            src={qrSrc} 
            alt="Room Invite QR Code" 
            width={size} 
            height={size}
            className="rounded-lg block object-contain"
            onError={(e) => {
              e.target.style.display = 'none';
            }}
          />
        </div>
      );
    }

    function App() {
      // Screens: 'landing', 'join', 'chat', 'expired'
      const [screen, setScreen] = useState('landing');
      const [roomIdParam, setRoomIdParam] = useState('');
      const [userToken] = useState(getSessionToken);
      
      const [isDarkMode, setIsDarkMode] = useState(() => {
        const saved = localStorage.getItem(THEME_KEY);
        return saved !== null ? saved === 'true' : true;
      });

      const [nickname, setNickname] = useState(() => {
        return localStorage.getItem("linkchat_last_nick") || "";
      });

      // Active room properties
      const [roomData, setRoomData] = useState(null);
      const [messages, setMessages] = useState([]);
      const [participants, setParticipants] = useState([]);
      const [isHost, setIsHost] = useState(false);
      const [isLocked, setIsLocked] = useState(false);
      const [timeRemaining, setTimeRemaining] = useState("");
      const [activeTypers, setActiveTypers] = useState({});

      // Modals & notices
      const [showShareModal, setShowShareModal] = useState(false);
      const [showInfoDrawer, setShowInfoDrawer] = useState(false);
      const [showReactionPickerFor, setShowReactionPickerFor] = useState(null);
      const [copiedNotice, setCopiedNotice] = useState(false);
      const [botActive, setBotActive] = useState(false);

      // Composer State
      const [inputText, setInputText] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const typingTimeoutRef = useRef(null);

      // References
      const messagesEndRef = useRef(null);
      const broadcastRef = useRef(null);
      const botIntervalRef = useRef(null);
      const peerConnectionRef = useRef(null);
      const dataChannelRef = useRef(null);

      const toggleTheme = () => {
        const next = !isDarkMode;
        setIsDarkMode(next);
        localStorage.setItem(THEME_KEY, String(next));
      };

      // Hybrid Route detector: checks both ?room=xyz AND /#/room/xyz
      const detectRoomFromUrl = useCallback(() => {
        const urlParams = new URLSearchParams(window.location.search);
        let r = urlParams.get('room');
        if (!r && window.location.hash.includes('room=')) {
          const hashParams = new URLSearchParams(window.location.hash.split('?')[1] || window.location.hash.replace('#', ''));
          r = hashParams.get('room');
        }
        return r;
      }, []);

      useEffect(() => {
        const r = detectRoomFromUrl();
        if (r) {
          setRoomIdParam(r);
          const raw = localStorage.getItem(STORAGE_PREFIX + r);
          if (raw) {
            try {
              const parsed = JSON.parse(raw);
              if (Date.now() > parsed.expiresAt) {
                setScreen('expired');
                return;
              }
              const myPart = parsed.participants?.find(p => p.token === userToken);
              if (myPart) {
                setNickname(myPart.nickname);
                setRoomData(parsed);
                setIsHost(parsed.hostToken === userToken);
                setScreen('chat');
                return;
              }
            } catch (err) {}
          }
          setScreen('join');
        } else {
          setScreen('landing');
        }
      }, [detectRoomFromUrl]);

      useEffect(() => {
        if (!roomData?.id) return;

        const channel = new BroadcastChannel(`linkchat_${roomData.id}`);
        broadcastRef.current = channel;

        try {
          const pc = new RTCPeerConnection(RTC_CONFIG);
          peerConnectionRef.current = pc;

          pc.ondatachannel = (e) => {
            const dc = e.channel;
            dataChannelRef.current = dc;
            dc.onmessage = (msgEvent) => {
              try {
                const packet = JSON.parse(msgEvent.data);
                handleIncomingPacket(packet);
              } catch (e) {}
            };
          };
        } catch (e) {
          console.warn("WebRTC initialization skipped: ", e);
        }

        channel.onmessage = (event) => {
          handleIncomingPacket(event.data);
        };

        dispatchPacket({
          type: 'PARTICIPANT_JOINED',
          payload: { 
            token: userToken, 
            nickname: nickname || "Guest", 
            avatarColor: getAvatarBg(nickname) 
          }
        });

        return () => {
          channel.close();
          if (peerConnectionRef.current) peerConnectionRef.current.close();
        };
      }, [roomData?.id]);

      const dispatchPacket = (packet) => {
        if (broadcastRef.current) {
          try {
            broadcastRef.current.postMessage(packet);
          } catch (e) {}
        }
        if (dataChannelRef.current && dataChannelRef.current.readyState === 'open') {
          try {
            dataChannelRef.current.send(JSON.stringify(packet));
          } catch (e) {}
        }
      };

      const handleIncomingPacket = (data) => {
        const { type, payload } = data;
        switch (type) {
          case 'NEW_MESSAGE':
            setMessages(prev => {
              if (prev.some(m => m.id === payload.id)) return prev;
              const next = [...prev, payload];
              return enforceCharacterLimit(next);
            });
            break;

          case 'REACTION':
            setMessages(prev => prev.map(msg => {
              if (msg.id !== payload.messageId) return msg;
              const curReactions = { ...(msg.reactions || {}) };
              const curUsers = curReactions[payload.emoji] || [];
              const hasReacted = curUsers.includes(payload.userToken);
              
              if (hasReacted) {
                curReactions[payload.emoji] = curUsers.filter(t => t !== payload.userToken);
                if (curReactions[payload.emoji].length === 0) delete curReactions[payload.emoji];
              } else {
                curReactions[payload.emoji] = [...curUsers, payload.userToken];
              }
              return { ...msg, reactions: curReactions };
            }));
            break;

          case 'USER_TYPING':
            if (payload.token !== userToken) {
              setActiveTypers(prev => ({
                ...prev,
                [payload.nickname]: Date.now() + 2500
              }));
            }
            break;

          case 'PARTICIPANT_JOINED':
            setParticipants(prev => {
              if (prev.some(p => p.token === payload.token)) return prev;
              return [...prev, payload];
            });
            addSystemMessage(`${payload.nickname} joined the chat`);
            break;

          case 'PARTICIPANT_LEFT':
            setParticipants(prev => prev.filter(p => p.token !== payload.token));
            addSystemMessage(`${payload.nickname} left the chat`);
            break;

          case 'ROOM_LOCKED_TOGGLE':
            setIsLocked(payload.locked);
            addSystemMessage(payload.locked ? "Host locked this room." : "Room unlocked by host.");
            break;

          case 'ROOM_DESTROYED':
            setScreen('expired');
            break;

          case 'KICKED':
            if (payload.targetToken === userToken) {
              alert("You have been removed from the room by the host.");
              leaveRoom(true);
            }
            break;

          default:
            break;
        }
      };

      // Interval for typing decay
      useEffect(() => {
        const interval = setInterval(() => {
          const now = Date.now();
          setActiveTypers(prev => {
            let changed = false;
            const updated = {};
            for (const [name, expire] of Object.entries(prev)) {
              if (expire > now) {
                updated[name] = expire;
              } else {
                changed = true;
              }
            }
            return changed ? updated : prev;
          });
        }, 800);
        return () => clearInterval(interval);
      }, []);

      // Expiration countdown
      useEffect(() => {
        if (!roomData?.expiresAt) return;
        const tick = () => {
          const remaining = roomData.expiresAt - Date.now();
          if (remaining <= 0) {
            setScreen('expired');
            localStorage.removeItem(STORAGE_PREFIX + roomData.id);
            return;
          }
          const hours = Math.floor(remaining / (1000 * 60 * 60));
          const mins = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
          const secs = Math.floor((remaining % (1000 * 60)) / 1000);
          setTimeRemaining(`${hours > 0 ? hours + 'h ' : ''}${mins}m ${secs < 10 ? '0' : ''}${secs}s`);
        };
        tick();
        const timer = setInterval(tick, 1000);
        return () => clearInterval(timer);
      }, [roomData?.expiresAt]);

      const scrollToBottom = (behavior = 'smooth') => {
        if (messagesEndRef.current) {
          messagesEndRef.current.scrollIntoView({ behavior });
        }
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages, activeTypers]);

      const enforceCharacterLimit = (msgs) => {
        let total = msgs.reduce((acc, m) => acc + (m.text ? m.text.length : 0), 0);
        const trimmed = [...msgs];
        while (total > MAX_BUFFER_CHARS && trimmed.length > 1) {
          const removed = trimmed.shift();
          if (removed && removed.text) {
            total -= removed.text.length;
          }
        }
        return trimmed;
      };

      const totalCharsUsed = useMemo(() => {
        return messages.reduce((acc, m) => acc + (m.text ? m.text.length : 0), 0);
      }, [messages]);

      const bufferPercentage = Math.min(100, Math.round((totalCharsUsed / MAX_BUFFER_CHARS) * 100));

      const addSystemMessage = (text) => {
        const sysMsg = {
          id: 'sys_' + Math.random().toString(36).substring(2, 9),
          type: 'system',
          text,
          timestamp: Date.now()
        };
        setMessages(prev => enforceCharacterLimit([...prev, sysMsg]));
      };

      const handleCreateRoom = (durationHours = 24, maxGuests = 6) => {
        if (!nickname.trim()) {
          alert("Please enter a temporary nickname first.");
          return;
        }

        localStorage.setItem("linkchat_last_nick", nickname.trim());
        const id = generateRoomId();
        const now = Date.now();
        const expiresAt = now + durationHours * 60 * 60 * 1000;

        const newRoom = {
          id,
          createdAt: now,
          expiresAt,
          maxGuests,
          locked: false,
          hostToken: userToken,
          participants: [
            { token: userToken, nickname: nickname.trim(), isHost: true, avatarColor: getAvatarBg(nickname) }
          ]
        };

        localStorage.setItem(STORAGE_PREFIX + id, JSON.stringify(newRoom));
        setRoomData(newRoom);
        setParticipants(newRoom.participants);
        setIsHost(true);
        setIsLocked(false);
        setMessages([
          {
            id: 'init_welcome',
            type: 'system',
            text: `🔒 Ephemeral room activated. All messages automatically disappear in ${durationHours} hours.`,
            timestamp: now
          }
        ]);

        window.history.pushState({}, '', `?room=${id}`);
        setScreen('chat');
        setShowShareModal(true);

        try {
          confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        } catch (e) {}
      };

      const handleJoinRoom = () => {
        if (!nickname.trim()) {
          alert("Please pick a nickname to join.");
          return;
        }

        const id = roomIdParam;
        localStorage.setItem("linkchat_last_nick", nickname.trim());
        
        let existing = localStorage.getItem(STORAGE_PREFIX + id);
        let parsed;
        if (existing) {
          parsed = JSON.parse(existing);
          if (parsed.locked) {
            alert("This room has been locked by the host.");
            return;
          }
        } else {
          parsed = {
            id,
            createdAt: Date.now(),
            expiresAt: Date.now() + 24 * 60 * 60 * 1000,
            maxGuests: 6,
            locked: false,
            hostToken: 'remote_peer_host',
            participants: []
          };
        }

        const myEntry = {
          token: userToken,
          nickname: nickname.trim(),
          isHost: false,
          avatarColor: getAvatarBg(nickname)
        };

        parsed.participants = [...(parsed.participants || []).filter(p => p.token !== userToken), myEntry];
        localStorage.setItem(STORAGE_PREFIX + id, JSON.stringify(parsed));

        setRoomData(parsed);
        setParticipants(parsed.participants);
        setIsHost(parsed.hostToken === userToken);
        setIsLocked(parsed.locked);
        setScreen('chat');

        dispatchPacket({
          type: 'PARTICIPANT_JOINED',
          payload: myEntry
        });
      };

      const handleSendMessage = (e) => {
        if (e) e.preventDefault();
        const trimmed = inputText.trim();
        if (!trimmed) return;

        const newMsg = {
          id: 'msg_' + Math.random().toString(36).substring(2, 9) + Date.now().toString(36),
          type: 'user',
          senderToken: userToken,
          senderNickname: nickname,
          text: trimmed,
          timestamp: Date.now(),
          reactions: {},
          urls: extractUrls(trimmed)
        };

        setMessages(prev => enforceCharacterLimit([...prev, newMsg]));
        setInputText("");

        dispatchPacket({
          type: 'NEW_MESSAGE',
          payload: newMsg
        });

        if (typingTimeoutRef.current) clearTimeout(typingTimeoutRef.current);
        setIsTyping(false);
      };

      const handleInputChange = (e) => {
        setInputText(e.target.value);

        if (!isTyping) {
          setIsTyping(true);
          dispatchPacket({
            type: 'USER_TYPING',
            payload: { token: userToken, nickname }
          });
        }

        if (typingTimeoutRef.current) clearTimeout(typingTimeoutRef.current);
        typingTimeoutRef.current = setTimeout(() => {
          setIsTyping(false);
        }, 1600);
      };

      const toggleReaction = (messageId, emoji) => {
        setShowReactionPickerFor(null);
        setMessages(prev => prev.map(msg => {
          if (msg.id !== messageId) return msg;
          const curReactions = { ...(msg.reactions || {}) };
          const curUsers = curReactions[emoji] || [];
          const hasReacted = curUsers.includes(userToken);

          if (hasReacted) {
            curReactions[emoji] = curUsers.filter(t => t !== userToken);
            if (curReactions[emoji].length === 0) delete curReactions[emoji];
          } else {
            curReactions[emoji] = [...curUsers, userToken];
          }
          return { ...msg, reactions: curReactions };
        }));

        dispatchPacket({
          type: 'REACTION',
          payload: { messageId, emoji, userToken }
        });
      };

      const toggleRoomLock = () => {
        if (!isHost) return;
        const newLockState = !isLocked;
        setIsLocked(newLockState);
        addSystemMessage(newLockState ? "Room locked. No new guests can enter." : "Room unlocked.");
        
        dispatchPacket({
          type: 'ROOM_LOCKED_TOGGLE',
          payload: { locked: newLockState }
        });
      };

      const kickParticipant = (targetToken, targetNick) => {
        if (!isHost) return;
        setParticipants(prev => prev.filter(p => p.token !== targetToken));
        addSystemMessage(`${targetNick} was removed from the room by the host.`);
        
        dispatchPacket({
          type: 'KICKED',
          payload: { targetToken }
        });
        dispatchPacket({
          type: 'PARTICIPANT_LEFT',
          payload: { token: targetToken, nickname: targetNick }
        });
      };

      const destroyRoomImmediately = () => {
        if (!window.confirm("Self-destruct this room right now? All messages and invite links will immediately vanish.")) return;
        dispatchPacket({ type: 'ROOM_DESTROYED' });
        localStorage.removeItem(STORAGE_PREFIX + roomData.id);
        setScreen('expired');
      };

      const leaveRoom = (kicked = false) => {
        dispatchPacket({
          type: 'PARTICIPANT_LEFT',
          payload: { token: userToken, nickname }
        });
        window.history.pushState({}, '', window.location.pathname);
        setScreen('landing');
      };

      const toggleBotSimulator = () => {
        if (botActive) {
          if (botIntervalRef.current) clearTimeout(botIntervalRef.current);
          setBotActive(false);
          addSystemMessage("Simulated partner (Chloe) left the chat.");
          setParticipants(prev => prev.filter(p => p.token !== 'bot_chloe'));
          return;
        }

        setBotActive(true);
        const botNick = "Chloe (Peer)";
        const botToken = "bot_chloe";
        setParticipants(prev => [...prev.filter(p => p.token !== botToken), {
          token: botToken,
          nickname: botNick,
          isHost: false,
          avatarColor: 'bg-emerald-500'
        }]);
        addSystemMessage("Chloe scanned the QR & joined the room!");

        const script = [
          { delay: 1500, typing: true },
          { delay: 3000, text: "Hey! Connected instantly from my phone. This UI is so clean! 🔥" },
          { delay: 5500, typing: true },
          { delay: 7800, text: "Check out this Instagram Reel: https://www.instagram.com/reel/C8qL8zFvX1m/" },
          { delay: 10500, typing: true },
          { delay: 13000, text: "And this YouTube Short: https://youtube.com/shorts/5O9n3x0Z8L4" }
        ];

        let index = 0;
        const runNext = () => {
          if (index >= script.length) return;
          const item = script[index++];
          botIntervalRef.current = setTimeout(() => {
            if (item.typing) {
              setActiveTypers(prev => ({ ...prev, [botNick]: Date.now() + 2500 }));
            }
            if (item.text) {
              const bMsg = {
                id: 'bot_msg_' + Date.now(),
                type: 'user',
                senderToken: botToken,
                senderNickname: botNick,
                text: item.text,
                timestamp: Date.now(),
                reactions: {},
                urls: extractUrls(item.text)
              };
              setMessages(prev => enforceCharacterLimit([...prev, bMsg]));
            }
            runNext();
          }, item.delay);
        };
        runNext();
      };

      const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${roomData?.id || ''}`;
      
      const handleNativeShare = async () => {
        if (navigator.share) {
          try {
            await navigator.share({
              title: "Join my LinkChat",

                </svg>

                            }

                              <a

                                href={meta.url}

                                rel="noopener noreferrer"
                                className="block bg-slate-900/60 rounded-xl p-2.5 border border-slate-700 hover:border-slate-500 transition-all text-left"
                              >
                                <div className="text-[11px] font-medium text-brand-300 truncate">{meta.domain}</div>
                                <div className="text-[10px] text-slate-400 truncate">{meta.url}</div>
                              </a>
                            );
                          })}

                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />

              <div className="flex items-center gap-2 text-xs text-slate-400 italic py-1 ml-2 animate-pulse">
                <div className="flex gap-1">
                  <span className="w-1.5 h-1.5 rounded-full bg-brand-400 animate-bounce"></span>
                  <span className="w-1.5 h-1.5 rounded-full bg-brand-400 animate-bounce [animation-delay:0.2s]"></span>
                  <span className="w-1.5 h-1.5 rounded-full bg-brand-400 animate-bounce [animation-delay:0.4s]"></span>
                </div>
                <span>{Object.keys(activeTypers).join(', ')} is typing...</span>
              </div>
            )}

            <div ref={messagesEndRef} />
          </main>

          {/* Bottom Fixed Composer */}
          <footer className={`p-3 border-t backdrop-blur-md sticky bottom-0 z-20 ${
            isDarkMode ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'
          }`}>
            <form onSubmit={handleSendMessage} className="flex items-center gap-2">
              <input
                type="text"
                placeholder="Type a message or paste a Reel link..."
                value={inputText}
                onChange={handleInputChange}
                className="flex-1 bg-slate-950 border border-slate-700/70 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all"
              />
              <button
                type="submit"
                disabled={!inputText.trim()}
                className={`p-3 rounded-2xl transition-all flex items-center justify-center ${
                  inputText.trim() 
                    ? 'bg-brand-600 hover:bg-brand-500 active:scale-95 text-white shadow-lg shadow-brand-500/30' 
                    : 'bg-slate-800 text-slate-600 cursor-not-allowed'
                }`}
              >
                <svg className="w-5 h-5 rotate-90" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                </svg>
              </button>
            </form>
          </footer>

          {/* Share & QR Code Modal */}
          {showShareModal && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4 backdrop-blur-sm animate-message">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 text-center relative shadow-2xl">
                <button
                  onClick={() => setShowShareModal(false)}
                  className="absolute top-4 right-4 p-1.5 text-slate-400 hover:text-white rounded-full bg-slate-800"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>

                <h3 className="text-xl font-bold text-white mb-1">Invite to Chat</h3>
                <p className="text-xs text-slate-400 mb-5">Scan with phone camera or send link.</p>

                <div className="flex justify-center mb-5">
                  <QRCodeRenderer text={inviteUrl} size={160} />
                </div>

                <div className="flex items-center gap-2 bg-slate-950 p-2 rounded-2xl border border-slate-800 mb-4">
                  <input
                    type="text"
                    readOnly
                    value={inviteUrl}
                    className="bg-transparent text-xs text-slate-300 w-full px-2 outline-none font-mono truncate"
                  />
                  <button
                    onClick={handleNativeShare}
                    className="px-3 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-xs font-semibold text-white whitespace-nowrap transition-colors"
                  >
                    {copiedNotice ? "Copied!" : "Copy"}
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => window.open(inviteUrl, '_blank')}
                    className="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 transition-colors flex items-center justify-center gap-1.5"
                  >
                    <span>Open 2nd Tab</span>
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                  </button>

                  <button
                    onClick={handleNativeShare}
                    className="py-2.5 px-3 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 text-xs font-semibold text-white transition-all flex items-center justify-center gap-1.5"
                  >
                    <span>Share Link</span>
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Drawer / Room Settings */}
          {showInfoDrawer && (
            <div className="fixed inset-0 z-50 bg-black/75 flex justify-end backdrop-blur-sm">
              <div className="w-full max-w-xs bg-slate-900 h-full p-5 flex flex-col justify-between border-l border-slate-800 shadow-2xl animate-message">
                <div>
                  <div className="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
                    <h3 className="font-bold text-white text-base">Room Details</h3>
                    <button
                      onClick={() => setShowInfoDrawer(false)}
                      className="p-1 rounded-lg text-slate-400 hover:text-white"
                    >
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                  </div>

                  <div className="mb-6">
                    <div className="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-3">
                      Participants ({participants.length})
                    </div>
                    <div className="space-y-2">
                      {participants.map(p => (
                        <div key={p.token} className="flex items-center justify-between p-2 rounded-xl bg-slate-950/60 border border-slate-800/80">
                          <div className="flex items-center gap-2.5">
                            <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white ${p.avatarColor || 'bg-brand-600'}`}>
                              {p.nickname.charAt(0).toUpperCase()}
                            </div>
                            <div className="text-xs font-medium text-slate-200 flex items-center gap-1.5">
                              <span>{p.nickname}</span>
                              {p.token === userToken && <span className="text-[10px] text-brand-400 font-normal">(You)</span>}
                              {p.isHost && <span className="text-[9px] bg-brand-500/20 text-brand-300 px-1 rounded">Host</span>}
                            </div>
                          </div>

                          {isHost && p.token !== userToken && (
                            <button
                              onClick={() => kickParticipant(p.token, p.nickname)}
                              className="text-slate-500 hover:text-rose-400 p-1 text-xs"
                              title="Remove guest"
                            >
                              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="p-3 bg-slate-950/80 rounded-2xl border border-slate-800 text-xs space-y-2 text-slate-400">
                    <div className="flex justify-between">
                      <span>Room ID</span>
                      <span className="font-mono text-slate-200">{roomData?.id}</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Auto expires in</span>
                      <span className="text-amber-400 font-mono">{timeRemaining}</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Message limit</span>
                      <span>10k char rolling</span>
                    </div>
                  </div>
                </div>

                <div className="space-y-2 pt-4 border-t border-slate-800">
                  {isHost && (
                    <>
                      <button
                        onClick={toggleRoomLock}
                        className={`w-full py-2.5 px-4 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 border transition-all ${
                          isLocked 
                            ? 'bg-amber-500/20 border-amber-500/40 text-amber-300' 
                            : 'bg-slate-800 border-slate-700 text-slate-200 hover:bg-slate-700'
                        }`}
                      >
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={isLocked ? "M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" : "M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"} />
                        </svg>
                        <span>{isLocked ? "Unlock Room" : "Lock Room"}</span>
                      </button>

                      <button
                        onClick={destroyRoomImmediately}
                        className="w-full py-2.5 px-4 rounded-xl text-xs font-semibold bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 flex items-center justify-center gap-2 transition-all"
                      >
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                        <span>Destroy Room Now</span>
                      </button>
                    </>
                  )}

                  <button
                    onClick={() => leaveRoom(false)}
                    className="w-full py-2.5 px-4 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors"
                  >
                    Leave Room
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
